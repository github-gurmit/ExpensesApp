<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Expenses</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--ac:#0f766e;--acx:#fff;--bd:#e3e6ea;--rd:#c2410c;--hl:#e6f4f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2328;--tx:#eef0f2;--mu:#99a3ad;--ac:#2dd4bf;--acx:#06201d;--bd:#2d343b;--rd:#fb923c;--hl:#17322f}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2328;--tx:#eef0f2;--mu:#99a3ad;--ac:#2dd4bf;--acx:#06201d;--bd:#2d343b;--rd:#fb923c;--hl:#17322f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big div{text-align:center}
.big small,.mu{color:var(--mu);font-size:13px}.big b{display:block;font-size:24px;margin-top:2px}
input,button{font:inherit;color:var(--tx)}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}.row>*{flex:1}
button{border:0;border-radius:10px;padding:12px;background:var(--ac);color:var(--acx);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:8px}.fr span{flex:1;font-weight:600}.fr input{flex:0 0 140px;text-align:right}
.ct{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.ct:last-child{border:0}
.x{background:none;color:var(--rd);padding:4px 8px;font-size:18px}
h3{margin:0 0 8px;font-size:15px}.hide{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{flex:0 0 auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:8px 14px}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.fb{margin-bottom:10px}
.ed{border:1px solid var(--ac);border-radius:10px;padding:10px;margin:6px 0}.ct button.g{padding:6px 12px;margin-left:8px}.fb .fr{margin-bottom:4px}.dn{font-size:14px;padding:8px 10px}.ct span{padding-right:10px}
.sc{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;margin-top:8px}
table{border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{border:1px solid var(--bd);padding:6px 7px;text-align:center;min-width:34px}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);text-align:left;min-width:84px;font-weight:600;z-index:1}
thead th{background:var(--bg)}th.t,td.t{font-weight:700;background:var(--bg)}
td.tdy,th.tdy{background:var(--hl)}tfoot td{font-weight:700;background:var(--bg)}
</style></head><body><div class="w">
<div class="top"><h1 id="ttl">Daily Expenses</h1><button class="g" id="setb">Settings</button></div>
<div class="tabs" id="tabs"></div>

<div id="main">
 <div class="card big"><div><small>Today Total</small><b id="tday">0</b></div><div><small>This Month Total</small><b id="tall">0</b></div></div>
 <div class="card">
  <div class="row"><h3 style="margin:0">Today’s Expenses</h3><input type="date" id="dt" style="max-width:170px"></div>
  <div id="form"></div>
  <div class="row"><span class="mu" id="prev"></span></div>
  <div class="row"><button id="add">Submit</button><button class="g" id="undo" style="flex:0 0 90px">Undo</button></div>
 </div>
 <div class="card">
  <div class="row"><h3 style="margin:0">Monthly Sheet</h3><input type="month" id="mon" style="max-width:170px"></div>
  <div class="sc" id="sheet"></div>
  <div class="row" style="margin-top:10px"><button id="pdf">Download PDF</button><button class="g" id="shr">Share PDF</button></div>
  <div class="mu" id="msg" style="margin-top:6px"></div></div>
 <div class="card"><h3>Entries</h3><div id="det"></div>
 </div>
</div>

<div id="set" class="hide">
 <div class="card"><h3>Your name / title</h3><input id="name" placeholder="e.g. Ayesha Expenses"></div>
 <div class="card"><h3>Names (list)</h3><div id="clist"></div>
  <div class="row" style="margin-top:8px"><input id="newc" placeholder="New name"><button id="addc" style="flex:0 0 80px">Add</button></div></div>
 <button style="width:100%" id="done">Done</button>
 <button class="g" style="width:100%;margin-top:8px" id="delt">Delete this sheet</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const mk=(id,name)=>({id,name,cats:["Travel","Food","Ration","Medicine","Misc"],items:[]});
let DB={cur:1,t:[mk(1,"Daily Expenses")]},last=[],S;
try{const r=JSON.parse(localStorage.getItem("kharcha1"));if(r&&r.t)DB=r;else if(r&&r.items)DB={cur:1,t:[Object.assign({id:1},r)]}}catch(e){}
const pick=id=>{S=DB.t.find(x=>x.id===id)||DB.t[0];DB.cur=S.id;last=[]};pick(DB.cur);
const save=()=>{try{localStorage.setItem("kharcha1",JSON.stringify(DB))}catch(e){}};
const refresh=()=>{$("ttl").textContent=S.name;document.title=S.name;renderTabs();renderForm();renderSheet()};
let editId=null;
function renderEntries(mi){const el=$("det");el.innerHTML=mi.length?"":'<div class="mu">No entries yet.</div>';
 [...mi].sort((p,q)=>p.d.localeCompare(q.d)||p.id-q.id).forEach(x=>{
  const lab=x.d.slice(8)+"/"+x.d.slice(5,7)+" \u00b7 "+x.c,r=document.createElement("div");
  if(x.id===editId){
   r.className="ed";r.innerHTML='<div class="mu"></div><div class="row"><input type="number" inputmode="decimal" class="ea"><input class="en" maxlength="80" placeholder="Description"></div><div class="row"><button class="sv">Save</button><button class="g cn">Cancel</button><button class="g dl">Delete</button></div>';
   r.firstChild.textContent=lab;r.querySelector(".ea").value=x.a;r.querySelector(".en").value=x.n||"";
   r.querySelector(".sv").onclick=()=>{const a=parseFloat(r.querySelector(".ea").value);if(!(a>0))return;x.a=a;x.n=r.querySelector(".en").value.trim();editId=null;last=[];save();renderSheet()};
   r.querySelector(".cn").onclick=()=>{editId=null;renderSheet()};
   r.querySelector(".dl").onclick=e=>{const b=e.target;if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent="Sure?";return}S.items=S.items.filter(y=>y.id!==x.id);editId=null;last=[];save();renderSheet()};
  }else{
   r.className="ct";r.innerHTML='<span></span><div style="white-space:nowrap"><b></b><button class="g">Edit</button></div>';
   r.firstChild.textContent=lab+(x.n?" \u00b7 "+x.n:"");r.querySelector("b").textContent=fmt(x.a);
   r.querySelector("button").onclick=()=>{editId=x.id;renderSheet()};
  }
  el.append(r)})}
function renderTabs(){const t=$("tabs");t.innerHTML="";
 DB.t.forEach(x=>{const b=document.createElement("button");b.className="tab"+(x.id===S.id?" on":"");b.textContent=x.name;b.onclick=()=>{pick(x.id);save();refresh()};t.append(b)});
 const p=document.createElement("button");p.className="tab";p.textContent="+ New";p.onclick=()=>{const o=mk(Date.now(),"New Sheet");DB.t.push(o);pick(o.id);save();setView(true)};t.append(p)}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("en-IN");
const sum=a=>a.reduce((s,x)=>s+x.a,0);
$("dt").value=today();$("mon").value=today().slice(0,7);

function grid(){
 const m=$("mon").value,[y,mo]=m.split("-").map(Number),n=new Date(y,mo,0).getDate();
 const mi=S.items.filter(x=>x.d.startsWith(m)),cats=[...S.cats];
 mi.forEach(x=>{if(!cats.includes(x.c))cats.push(x.c)});
 const cell=(c,d)=>sum(mi.filter(x=>x.c===c&&x.d===m+"-"+String(d).padStart(2,"0")));
 const ds=mi.map(x=>+x.d.slice(8)),a=ds.length?Math.min(...ds):1,z=ds.length?Math.max(...ds):0;
 return {m,n,mi,cats,cell,a,z};
}
function renderForm(){
 $("form").innerHTML="";
 S.cats.forEach(c=>{const w=document.createElement("div");w.className="fb";w.innerHTML='<div class="fr"><span></span><input type="number" inputmode="decimal" placeholder="0"></div><input class="dn" maxlength="80" placeholder="Short description (optional)">';const d=w.firstChild;
  d.firstChild.textContent=c;d.lastChild.dataset.c=c;d.lastChild.oninput=prev;$("form").append(w)});
 prev();
}
function prev(){const t=[...$("form").querySelectorAll("input[data-c]")].reduce((s,i)=>s+(parseFloat(i.value)||0),0);$("prev").textContent=t?"Current total: "+fmt(t):""}
function renderSheet(){
 const {m,n,mi,cats,cell,a,z}=grid(),td=today();
 $("tday").textContent=fmt(sum(S.items.filter(x=>x.d===td)));
 $("tall").textContent=fmt(sum(mi));
 let h='<table><thead><tr><th>'+m.split("-").reverse().join("/")+'</th>',b="",f='<tfoot><tr><td>Total</td>';
 for(let d=a;d<=z;d++)h+='<th class="'+(m+"-"+String(d).padStart(2,"0")===td?"tdy":"")+'">'+d+'</th>';
 h+='<th class="t">Total</th></tr></thead><tbody>';
 const col=Array(n+1).fill(0);
 cats.forEach(c=>{let r="<tr><td></td>",t=0;
  for(let d=a;d<=z;d++){const v=cell(c,d);t+=v;col[d]+=v;r+='<td class="'+(m+"-"+String(d).padStart(2,"0")===td?"tdy":"")+'">'+(v?fmt(v):"")+'</td>'}
  r+='<td class="t">'+fmt(t)+"</td></tr>";b+=r.replace("<td></td>","<td>"+c.replace(/[<&]/g,"")+"</td>")});
 for(let d=a;d<=z;d++)f+="<td>"+(col[d]?fmt(col[d]):"")+"</td>";
 f+="<td>"+fmt(sum(mi))+"</td></tr></tfoot>";
 $("sheet").innerHTML=h+b+"</tbody>"+f+"</table>";
 const dl=mi.filter(x=>x.n).sort((p,q)=>p.d.localeCompare(q.d));
 renderEntries(mi);
 [].forEach(x=>{const r=document.createElement("div");r.className="ct";r.innerHTML="<span></span><b></b>";r.firstChild.textContent=x.d.slice(8)+"/"+x.d.slice(5,7)+" \u00b7 "+x.c+" \u00b7 "+x.n;r.lastChild.textContent=fmt(x.a);$("det").append(r)});
}
$("mon").onchange=renderSheet;
$("add").onclick=()=>{
 const d=$("dt").value;if(!d)return;last=[];
 $("form").querySelectorAll("input[data-c]").forEach(i=>{const a=parseFloat(i.value);if(!(a>0))return;const dn=i.closest(".fb").querySelector(".dn"),nt=dn.value.trim();
  const e=S.items.find(x=>x.d===d&&x.c===i.dataset.c);
  if(e){last.push({id:e.id,old:e.a,on:e.n||""});e.a+=a;if(nt)e.n=[e.n,nt].filter(Boolean).join(", ")}else{const o={id:Date.now()+last.length,d:d,c:i.dataset.c,a:a,n:nt};S.items.push(o);last.push({id:o.id,old:0})}
  i.value="";dn.value=""});
 if(!last.length)return;
 $("mon").value=d.slice(0,7);save();prev();renderSheet();$("msg").textContent="Added to sheet.";
};
$("undo").onclick=()=>{last.forEach(l=>{const e=S.items.find(x=>x.id===l.id);if(e){e.a=l.old;if(l.on!==undefined)e.n=l.on}});S.items=S.items.filter(x=>x.a>0);last=[];save();renderSheet();$("msg").textContent="Last submit removed."};

function setView(s){$("set").classList.toggle("hide",!s);$("main").classList.toggle("hide",s);$("setb").classList.toggle("hide",s);$("tabs").classList.toggle("hide",s);
 if(s){$("name").value=S.name;cl();$("delt").classList.toggle("hide",DB.t.length<2);$("delt").dataset.s="";$("delt").textContent="Delete this sheet"}else{refresh()}}
$("delt").onclick=()=>{const b=$("delt");if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent="Tap again to confirm delete";return}
 b.dataset.s="";b.textContent="Delete this sheet";if(DB.t.length>1){DB.t=DB.t.filter(x=>x.id!==S.id);pick(DB.t[0].id);save();setView(false)}};
function cl(){$("clist").innerHTML="";S.cats.forEach((c,i)=>{const d=document.createElement("div");d.className="ct";d.innerHTML='<span></span><button class="x">×</button>';d.firstChild.textContent=c;
 d.lastChild.onclick=()=>{if(S.cats.length>1){S.cats.splice(i,1);save();cl()}};$("clist").append(d)})}
$("setb").onclick=()=>setView(true);
$("done").onclick=()=>{S.name=$("name").value.trim()||"Daily Expenses";save();setView(false)};
$("addc").onclick=()=>{const v=$("newc").value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);$("newc").value="";save();cl()}};

async function mkpdf(share){
 const {m,mi,cats,cell,a,z}=grid(),n=Math.max(z-a+1,1);
 if(!mi.length){$("msg").textContent="No entries this month.";return}
 const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"landscape"}),M=8,NW=30,TW=18,DW=(297-2*M-NW-TW)/n,RH=6.5;
 let y=18;doc.setFontSize(15);doc.text(S.name,M,y);doc.setFontSize(10);doc.text("Month: "+m,M,y+6);y+=12;
 const num=v=>v?String(Math.round(v*100)/100):"";
 const row=(lab,vals,tot,bold)=>{
  if(y+RH>200){doc.addPage();y=14}
  doc.setFont(undefined,bold?"bold":"normal");doc.setFontSize(6.5);let x=M;
  doc.rect(x,y,NW,RH);doc.text(String(lab).replace(/[^\x20-\x7E]/g,"?").slice(0,16),x+1.2,y+4.4);x+=NW;
  vals.forEach(v=>{doc.rect(x,y,DW,RH);if(v)doc.text(String(v),x+DW/2,y+4.4,{align:"center"});x+=DW});
  doc.rect(x,y,TW,RH);doc.setFont(undefined,"bold");doc.text(String(tot),x+TW/2,y+4.4,{align:"center"});y+=RH};
 row("Name",Array.from({length:n},(_,i)=>a+i),"Total",true);
 const col=Array(n).fill(0);
 cats.forEach(c=>{const v=Array.from({length:n},(_,i)=>cell(c,a+i));v.forEach((q,i)=>col[i]+=q);row(c,v.map(num),num(v.reduce((a,b)=>a+b,0))||"0")});
 row("Total",col.map(num),num(sum(mi)),true);
 const dl=mi.filter(x=>x.n).sort((p,q)=>p.d.localeCompare(q.d));
 if(dl.length){y+=8;if(y>195){doc.addPage();y=14}doc.setFont(undefined,"bold");doc.setFontSize(10);doc.text("Details",M,y);y+=6;doc.setFont(undefined,"normal");doc.setFontSize(8);
  dl.forEach(x=>{if(y>200){doc.addPage();y=14}doc.text(x.d.slice(8)+"/"+x.d.slice(5,7)+"  "+x.c.slice(0,16)+": "+x.n.replace(/[^\x20-\x7E]/g,"?").slice(0,110),M,y);doc.text(String(Math.round(x.a*100)/100),289,y,{align:"right"});y+=5})}
 const blob=doc.output("blob"),fn=(S.name.replace(/[^\w\- ]/g,"").trim().replace(/\s+/g,"-")||"expenses")+"-"+m+".pdf";
 const file=new File([blob],fn,{type:"application/pdf"});
 try{
  if(share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:S.name});$("msg").textContent=""}
  else{const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=fn;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);$("msg").textContent=share?"Sharing not supported here, PDF downloaded.":"PDF downloaded."}
 }catch(e){$("msg").textContent=e&&e.name==="AbortError"?"":"Could not save PDF."}
}
$("pdf").onclick=()=>mkpdf(false);$("shr").onclick=()=>mkpdf(true);
refresh();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
